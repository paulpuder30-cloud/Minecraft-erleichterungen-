name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: erleichterungen-mod
          path: build/libs/*.jar

  erl-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erl-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Upload ERL-Client jar
        uses: actions/upload-artifact@v4
        with:
          name: erl-client
          path: erl-client/build/libs/*.jar
